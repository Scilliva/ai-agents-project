# Makes `import project` and `import app` work from any script in your
# repository, however you run it. Copy this file to the root of your
# repository, next to the project/ and app/ packages, and run
# `pip install -e .` once inside your venv. The install is editable, so edits
# to project/ and app/ take effect without reinstalling.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agents-project"
version = "0.1.0"
description = "BPINFOR-132 project spine, the application, and the fourteen practical sessions built on them"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.9,<3"]

# Found by name rather than listed, so the install works before app/ exists
# and after, and the folders you unpacked beside them (labs/, project_spine/,
# app_skeleton/) are never installed as packages of their own.
[tool.setuptools.packages.find]
include = ["project", "project.*", "app", "app.*"]
namespaces = false
