name: Week 10 free checks

on: [push, pull_request]

jobs:
  free-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "pytest>=8" "pydantic>=2.9,<3"
      - name: Run and time Week 10 free checks
        working-directory: labs/week10/starter
        run: /usr/bin/time -p python -m pytest -q -m "not judged"
